# Secrets and hosts come from NEXIA_* environment variables. The empty values
# here are deliberate: the server refuses to start until they are provided.
server:
  port: 8080
  mode: release
  jwt_secret: ""
  # Sessions renew themselves while in use (see middleware/auth.ts), so this is
  # how long an idle session lasts, not an upper bound on an active one.
  jwt_expiry_minutes: 1440
  auth_rate_limit_requests: 10
  auth_rate_limit_window_seconds: 10
  auth_rate_limit_burst: 10
  chat_rate_limit_requests: 10
  chat_rate_limit_window_seconds: 60
  chat_rate_limit_burst: 3
  cors_origins: []
  cookie_domain: ""
  # Railway's edge proxy writes the caller's address here.
  client_ip_header: "x-real-ip"

db:
  host: ""
  port: 5432
  user: ""
  password: ""
  name: ""
  ssl_mode: "require"
  run_migrations: true
  idle_timeout_seconds: 300
  max_open_conns: 50
  conn_max_lifetime_minutes: 60

ai:
  gemini_api_key: ""
  opencode_api_key: ""
  opencode_base_url: "https://opencode.ai/zen/v1"
  chat_model: "space-bunny-free"
  embedding_interval_seconds: 30

email:
  resend_api_key: ""
  from_address: "Nexia <noreply@nexia.hishaam.dev>"
  app_base_url: ""
