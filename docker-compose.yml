services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nexia-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: always

  redis:
    image: redis:7-alpine
    container_name: nexia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:
