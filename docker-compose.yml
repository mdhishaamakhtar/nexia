services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nexia-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nexia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexia-redis
    volumes:
      - redis_data:/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexia-backend
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=prod
      - NEXIA_DB_HOST=postgres
      - NEXIA_DB_PORT=5432
      - NEXIA_DB_USER=postgres
      - NEXIA_DB_PASSWORD=password
      - NEXIA_DB_NAME=nexia_db
      - NEXIA_DB_SSL_MODE=disable
      - NEXIA_AI_REDIS_URL=redis:6379
      - NEXIA_AI_GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEXIA_AI_OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - NEXIA_EMAIL_RESEND_API_KEY=${NEXIA_EMAIL_RESEND_API_KEY}
      - NEXIA_SERVER_JWT_SECRET=${NEXIA_SERVER_JWT_SECRET}
      - NEXIA_SERVER_CORS_ORIGINS=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
    container_name: nexia-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
