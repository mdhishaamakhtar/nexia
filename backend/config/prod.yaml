server:
  port: 8080
  mode: release
  jwt_secret: "" # MUST be set via NEXIA_SERVER_JWT_SECRET
  jwt_expiry_minutes: 60
  auth_rate_limit_requests: 10 # Override via NEXIA_SERVER_AUTH_RATE_LIMIT_REQUESTS if needed
  auth_rate_limit_window_seconds: 10 # Override via NEXIA_SERVER_AUTH_RATE_LIMIT_WINDOW_SECONDS if needed
  auth_rate_limit_burst: 10 # Override via NEXIA_SERVER_AUTH_RATE_LIMIT_BURST if needed
  chat_rate_limit_requests: 10 # Override via NEXIA_SERVER_CHAT_RATE_LIMIT_REQUESTS if needed
  chat_rate_limit_window_seconds: 60 # Override via NEXIA_SERVER_CHAT_RATE_LIMIT_WINDOW_SECONDS if needed
  chat_rate_limit_burst: 3 # Override via NEXIA_SERVER_CHAT_RATE_LIMIT_BURST if needed
  cors_origins: [] # Set via NEXIA_SERVER_CORS_ORIGINS (comma-separated)
  cookie_domain: "" # Set via NEXIA_SERVER_COOKIE_DOMAIN (e.g. .hishaam.dev)

db:
  host: ""
  port: 5432
  user: ""
  password: ""
  name: ""
  ssl_mode: "require"
  run_migrations: true # Set NEXIA_DB_RUN_MIGRATIONS=false in production
  max_idle_conns: 10
  max_open_conns: 50
  conn_max_lifetime_minutes: 60

ai:
  gemini_api_key: ""
  redis_url: "127.0.0.1:6379"

email:
  resend_api_key: "" # Set via NEXIA_EMAIL_RESEND_API_KEY
  from_address: "Nexia <noreply@nexia.hishaam.dev>"
  app_base_url: "" # Set via NEXIA_EMAIL_APP_BASE_URL
