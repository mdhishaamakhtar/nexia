server:
  port: 8080
  mode: debug
  jwt_secret: "super-secret-key-for-dev"
  jwt_expiry_minutes: 1440
  cors_origins:
    - "http://localhost:3000"
  cookie_domain: "" # empty = browser defaults to request host (fine for localhost)

db:
  host: localhost
  port: 5432
  user: postgres
  password: password
  name: nexia_db
  ssl_mode: disable
  run_migrations: true
  max_idle_conns: 10
  max_open_conns: 50
  conn_max_lifetime_minutes: 60

ai:
  gemini_api_key: ""
  redis_url: "127.0.0.1:6379"

email:
  resend_api_key: "" # empty = disabled locally; set NEXIA_EMAIL_RESEND_API_KEY in prod
  from_address: "Nexia <noreply@nexia.hishaam.dev>"
  app_base_url: "http://localhost:3000"
